name: Build, Scan, and Publish Recipes

# Phase 2 CI mechanism (docs/ARCHITECTURE.md): generic and mechanical, runs against
# every recipes/*/recipe.yaml. Discovers which recipes have a new upstream version,
# builds+scans each declared platform separately (a multi-platform manifest can't be
# loaded locally for scanning -- see docs/THREAT_MODEL.md for why nothing is ever
# pushed before its scan passes), and only assembles+pushes the combined manifest
# once every platform for that recipe has independently passed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: curated-images-build-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      recipes: ${{ steps.discover.outputs.recipes }}
      build_matrix: ${{ steps.discover.outputs.build_matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - id: discover
        run: python3 scripts/discover_recipes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One leg per (recipe, platform). Builds and scans a single-platform image (the only
  # kind buildx can --load locally) and, only on a clean scan, pushes it under an
  # arch-suffixed tag -- ghcr.io/.../curated-technitium:v15.5.1-linux-arm64, e.g. This
  # is never the recipe's real, user-facing tag; publish-manifest assembles that
  # afterward, once every platform for this recipe has reached this point.
  build:
    needs: discover
    if: needs.discover.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.recipe.platform != 'linux/amd64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Trivy/Dockle are installed at whatever's current each run, deliberately not
      # pinned like the recipe's own upstream build inputs are (constraint 6) -- their
      # entire value is scanning against an up-to-date vulnerability DB/ruleset, so
      # pinning the scanner itself would work against the point of running it on a
      # schedule.
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Dockle
        run: |
          DOCKLE_VERSION=$(curl -s https://api.github.com/repos/goodwithtech/dockle/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sL -o /tmp/dockle.deb "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/dockle.deb

      - name: Build local candidate for this platform (never pushed until scans pass)
        run: |
          build_args=()
          while IFS='=' read -r kv; do
            [ -n "$kv" ] && build_args+=(--build-arg "$kv")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< '${{ toJson(matrix.recipe.build_args) }}')
          docker buildx build --load --platform "${{ matrix.recipe.platform }}" "${build_args[@]}" \
            -f "${{ matrix.recipe.dockerfile }}" \
            -t "local-candidate:${{ matrix.recipe.name }}-${{ matrix.recipe.platform_slug }}" \
            "${{ matrix.recipe.context }}"

      # Tier 1 scanning (docs/THREAT_MODEL.md) -- against the local single-platform
      # image directly, no push/pull round-trip. Thresholds calibrated against this
      # recipe's actual first scan (2026-09-26, linux/amd64): 0 CRITICAL/HIGH, 8
      # MEDIUM (unrelated glibc CVEs) -- 0 Dockle WARN/FATAL. Not yet independently
      # calibrated against an arm64 build of this same image (see recipe.yaml's own
      # note on the still-open arm64 end-to-end validation gap).
      - name: Trivy scan (fails on CRITICAL/HIGH)
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            "local-candidate:${{ matrix.recipe.name }}-${{ matrix.recipe.platform_slug }}"

      - name: Dockle scan (fails on WARN or worse)
        run: |
          dockle --exit-code 1 --exit-level WARN \
            "local-candidate:${{ matrix.recipe.name }}-${{ matrix.recipe.platform_slug }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only reached if both scans above passed. Pushed under an arch-suffixed tag,
      # not the recipe's real tag -- see the job comment above.
      - name: Push arch-suffixed image
        id: push
        run: |
          target="${{ matrix.recipe.image_name }}:${{ matrix.recipe.resolved_ref }}-${{ matrix.recipe.platform_slug }}"
          docker tag "local-candidate:${{ matrix.recipe.name }}-${{ matrix.recipe.platform_slug }}" "$target"
          docker push "$target"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$target")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record this platform's result for the manifest job
        run: |
          mkdir -p platform-results
          jq -n --arg platform "${{ matrix.recipe.platform }}" --arg digest "${{ steps.push.outputs.digest }}" \
            '{platform: $platform, digest: $digest}' \
            > "platform-results/${{ matrix.recipe.platform_slug }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-result-${{ matrix.recipe.name }}-${{ matrix.recipe.platform_slug }}
          path: platform-results/${{ matrix.recipe.platform_slug }}.json

  # Runs once per recipe (not per platform). Only assembles and pushes the real,
  # user-facing multi-arch manifest tag for a recipe once EVERY platform it declares
  # has its own successful, independently-scanned platform-result artifact -- a
  # partial platform failure means no manifest, no tag, nothing new for that recipe
  # this run (matches "a failed build/scan means nothing reaches GHCR for that run").
  publish-manifest:
    needs: [discover, build]
    if: always() && needs.discover.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: platform-result-*
          path: platform-results
          merge-multiple: false

      - name: Assemble and push the manifest for each fully-passed recipe
        run: |
          mkdir -p state-updates
          echo '${{ needs.discover.outputs.recipes }}' > recipes.json
          for recipe_json in $(jq -c '.[]' recipes.json); do
            name=$(jq -r '.name' <<< "$recipe_json")
            ref=$(jq -r '.resolved_ref' <<< "$recipe_json")
            image=$(jq -r '.image_name' <<< "$recipe_json")
            platforms=$(jq -r '.platforms[]' <<< "$recipe_json")

            digests=()
            complete=true
            for platform in $platforms; do
              slug="${platform//\//-}"
              result_file="platform-results/platform-result-${name}-${slug}/${slug}.json"
              if [ ! -f "$result_file" ]; then
                echo "$name: missing result for $platform -- not all platforms passed, skipping manifest"
                complete=false
                break
              fi
              digests+=("$(jq -r '.digest' "$result_file")")
            done

            if [ "$complete" != "true" ]; then
              continue
            fi

            echo "$name: all platforms passed, assembling manifest for $image:$ref"
            docker buildx imagetools create -t "$image:$ref" "${digests[@]}"
            manifest_digest=$(docker buildx imagetools inspect "$image:$ref" --format '{{json .Manifest}}' | jq -r '.digest')

            jq -n --arg ref "$ref" --arg digest "$manifest_digest" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{last_built_ref: $ref, last_built_digest: $digest, last_built_at: $at}' \
              > "state-updates/${name}.json"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('state-updates/*.json') != ''
        with:
          name: state-updates
          path: state-updates/*.json

  update-state:
    needs: [discover, publish-manifest]
    if: always() && needs.discover.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: state-updates
          path: state-updates

      - name: Apply state updates for whichever recipes fully passed
        run: |
          shopt -s nullglob
          files=(state-updates/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no successful builds to record"
            exit 0
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f" .json)"
            cp "$f" "recipes/${name}/.state.json"
            git add "recipes/${name}/.state.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update .state.json for rebuilt recipes"
          git push
