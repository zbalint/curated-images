name: technitium
description: >
  Technitium DNS Server, compiled from source, running as the repo-wide fixed non-root
  identity (65532:65532) on a distroless-equivalent base (Ubuntu Chiseled), with a
  build-time NET_BIND_SERVICE file capability to bind port 53 without root, and
  libmsquic included for DNS-over-QUIC feature parity with upstream's own image.
  Adapted from prototype/technitium-hardened-build and prototype/technitium-distroless-
  msquic; see those branches' READMEs for the full build/capability/distroless
  investigation this recipe carries forward.

upstream:
  repository: https://github.com/TechnitiumSoftware/DnsServer.git
  tracking:
    mode: github_release
    # DnsServer publishes formal GitHub Releases (not just tags), so the Releases API
    # resolves the newest version directly. TechnitiumLibrary's own matching tag
    # ("dns-server-<resolved_ref>") is derived inside the Dockerfile from this same
    # resolved version -- see build.args below and the Dockerfile's own comment on why
    # that derivation is safe (confirmed empirically for v15.5.1).

image:
  name: ghcr.io/zbalint/curated-technitium
  # Public-facing text for the OCI org.opencontainers.image.description label/
  # annotation (GHCR's package page reads this) -- deliberately separate from this
  # file's own top-level `description` above, which is written for someone reading
  # this YAML (UID numbers, prototype-branch pointers) rather than a stranger on the
  # package page. No CVE counts or image-size numbers here on purpose: both drift
  # out of date the moment the vulnerability DB updates or either image changes,
  # with nothing in this pipeline that re-publishes this label when that happens.
  description: >-
    Hardened, distroless build of Technitium DNS Server, compiled from source. Runs
    fully non-root with a single NET_BIND_SERVICE capability instead of root, on
    Ubuntu Chiseled with no shell or package manager at runtime. Feature parity with
    upstream, including DNS-over-QUIC (libmsquic) -- KNOWN ISSUE: DoQ upstream
    forwarders crash the process on arm64 (see runtime.gvisor_tested comment and
    build.dockerfile's own comment below); all other functionality, including plain
    DNS and non-QUIC forwarders, is unaffected. Multi-arch (amd64/arm64). Trivy+Dockle
    scanned on every build -- see the workflow run's summary/artifacts for the
    current report.
  platforms:
    - linux/amd64
    - linux/arm64
    # arm64 because a real known deployment target for Technitium is arm64 hardware
    # (confirmed via that hardware's own apt config, 2026-09-26) already running
    # Technitium today. Base image + libmsquic apt repo both confirmed to publish
    # arm64 variants (docker manifest inspect / apt Packages index).
    #
    # 2026-09-27 CONFIRMED BUG on real arm64 hardware (Radxa Zero 3E, DietPi): a DoQ
    # (DNS-over-QUIC) upstream forwarder crashes the process with SIGABRT (exit 134)
    # the moment a query actually exercises the QUIC path -- reported via a live
    # crash-loop on zbalint's homelab DNS board. Root-caused via a controlled A/B
    # test: stock upstream technitium/dns-server:latest, run against the exact same
    # named config volume on the exact same board, crashes identically. This proves
    # it is an upstream msquic/OpenSSL bug on aarch64, NOT something this recipe's
    # hardening (capabilities, read-only rootfs, chiseled base, ld.so.cache setup)
    # introduced -- matches known upstream reports, e.g. microsoft/msquic#5210
    # (aarch64 + OpenSSL crashing in the QUIC handshake's mutex handling). Plain DNS
    # resolution and non-QUIC forwarders (DoH/DoT/UDP) are unaffected. No known
    # workaround on this recipe's side today -- the fix, if any, has to land
    # upstream in msquic/OpenSSL. Full investigation: SALTMDB memory (see recipe
    # README). Not yet confirmed whether amd64 shares this bug -- the only report so
    # far is on real arm64 hardware.

build:
  dockerfile: Dockerfile
  args:
    DNS_SERVER_VERSION: "${resolved_ref}"

runtime:
  base: distroless
  # mcr.microsoft.com/dotnet/aspnet:10.0-noble-chiseled -- Microsoft's distroless-
  # equivalent for .NET. Validated this session: setcap applied to the base's own
  # dotnet binary in an intermediate stage (chiseled has no shell/apt/useradd of its
  # own, so setcap/passwd-group/mkdir all happen in earlier full-Ubuntu-Noble stages
  # and are copied across), functional under both runc and runsc. See
  # prototype/technitium-distroless-msquic's README for the full investigation,
  # including the COPY-of-an-empty-directory-drops-ownership gotcha found and fixed.
  gvisor_tested: true
  # Validated this session directly against this recipe's own built image (not a
  # throwaway diagnostic listener, closing the item flagged when this recipe.yaml was
  # first written): ran with --user 65532:65532 --cap-drop ALL --cap-add
  # NET_BIND_SERVICE --read-only --tmpfs /tmp, a named Docker volume for /etc/dns, on a
  # dedicated bridge network, under --runtime=runsc. Clean startup, no exceptions,
  # dig against the published port returned a real answer, web console reachable
  # (HTTP 200). Not yet reconfirmed on the actual ARM Radxa fleet hardware -- x86_64
  # WSL2 dev box only, same caveat as the network-mode decision.
